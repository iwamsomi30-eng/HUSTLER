name: Build MFUKO WA MAPATO YA KANISA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tengeneza folder la Android
        run: flutter create --platforms=android --project-name mfuko_wa_kanisa --org tz.mfuko .
      - name: Ruhusu internet kwa cloud sync
        shell: bash
        run: sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Ruhusa ya kutuma SMS (uthibitisho wa michango)
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.telephony" android:required="false" />' "$M"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SEND_SMS" />' "$M"
          F=$(find android/app/src/main -name 'MainActivity.kt' | head -n1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/^package //; s/[[:space:]]*$//')
          sed "s/__PKG__/$PKG/" branding/android/MainActivity.kt.txt > "$F"
          echo "MainActivity: $F (package $PKG)"
      - name: Ruhusa ya kusakinisha masasisho (update ndani ya app)
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' "$M"
          cat > /tmp/prov.xml <<'EOF'
              <provider
                  android:name=".UpdateFileProvider"
                  android:authorities="${applicationId}.updateprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/update_paths" />
              </provider>
          EOF
          perl -0pi -e 'BEGIN{ open F, "/tmp/prov.xml"; local $/; $p = <F>; close F } s#</application>#$p</application>#' "$M"
          grep -c UpdateFileProvider "$M"
      - name: Funguo ya kudumu ya kusaini (lazima ili update isakinishwe juu ya toleo la zamani)
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 haijawekwa. Kila build itasainiwa kwa funguo tofauti, hivyo update ndani ya app HAITASAKINISHA juu ya toleo la zamani."
          else
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Funguo ya kudumu imewekwa."
          fi
      - name: Weka logo kama icon na launch screen
        shell: bash
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          cp -r branding/android/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'ic_launcher*' | sort
      - name: Jina la app
        run: sed -i 's/android:label="[^"]*"/android:label="Mfuko wa Mapato ya Kanisa"/' android/app/src/main/AndroidManifest.xml
      - name: Lazimisha compileSdk 36 kwa plugins zote
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              val fixSdk = {
                  extensions.findByName("android")?.let {
                      (it as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
                  }
                  Unit
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          EOF
          else
          cat >> android/build.gradle <<'EOF'

          subprojects { p ->
              def fixSdk = {
                  if (p.hasProperty('android')) {
                      p.android { compileSdkVersion 36 }
                  }
              }
              if (p.state.executed) { fixSdk() } else { p.afterEvaluate { fixSdk() } }
          }
          EOF
          fi
      - run: flutter pub get
      - name: Hakiki Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::GitHub secrets SUPABASE_URL na/au SUPABASE_PUBLISHABLE_KEY hazijawekwa (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co*) ;; *) echo "::error::SUPABASE_URL lazima ianze na https:// na iwe ya supabase.co"; exit 1;; esac
      - name: Build apk
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=GITHUB_REPO="${{ github.repository }}"
      - name: Pa APK jina la kudumu
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk build/mfuko-wa-kanisa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mfuko-android-apk
          path: build/mfuko-wa-kanisa.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tengeneza folder la Windows
        run: flutter create --platforms=windows --project-name mfuko_wa_kanisa --org tz.mfuko .
      - name: Jina la dirisha
        shell: bash
        run: sed -i 's/L"mfuko_wa_kanisa"/L"MFUKO WA MAPATO YA KANISA"/' windows/runner/main.cpp
      - name: Weka logo kama icon ya Windows
        shell: bash
        run: cp branding/windows/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - name: Hakiki Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::GitHub secrets SUPABASE_URL na/au SUPABASE_PUBLISHABLE_KEY hazijawekwa (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co*) ;; *) echo "::error::SUPABASE_URL lazima ianze na https:// na iwe ya supabase.co"; exit 1;; esac
      - name: Build windows
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=GITHUB_REPO="${{ github.repository }}"
      - name: Funga app ya Windows kuwa zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/mfuko-wa-kanisa-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mfuko-windows-app
          path: build/mfuko-wa-kanisa-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Soma toleo kutoka pubspec.yaml
        id: ver
        shell: bash
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Toleo: $V"
      - name: Chapisha GitHub Release (hapa ndipo app za watumiaji zinapoangalia update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Toleo ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*/*.apk
            dist/*/*.zip
