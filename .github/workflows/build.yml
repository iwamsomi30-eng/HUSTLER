name: Build MFUKO WA MAPATO YA KANISA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tengeneza folder la Android
        run: flutter create --platforms=android --project-name mfuko_wa_kanisa --org tz.mfuko .
      - name: Jina la app
        run: sed -i 's/android:label="[^"]*"/android:label="Mfuko wa Mapato ya Kanisa"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mfuko-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tengeneza folder la Windows
        run: flutter create --platforms=windows --project-name mfuko_wa_kanisa --org tz.mfuko .
      - name: Jina la dirisha
        shell: bash
        run: sed -i 's/L"mfuko_wa_kanisa"/L"MFUKO WA MAPATO YA KANISA"/' windows/runner/main.cpp
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: mfuko-windows-app
          path: build/windows/x64/runner/Release
