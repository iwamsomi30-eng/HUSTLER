name: MFUKO WA MAPATO YA KANISA - Production Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "MFUKO WA MAPATO YA KANISA"
  APP_ID: "mfuko_wa_kanisa"

jobs:

  # ============================================================
  # WINDOWS - BUILD APPLICATION + PROFESSIONAL INSTALLER
  # ============================================================
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Prepare Windows project
        shell: pwsh
        run: |
          flutter create `
            --platforms=windows `
            --project-name $env:APP_ID `
            --org tz.mfuko `
            .

      - name: Configure application name
        shell: pwsh
        run: |
          $file = "windows/runner/main.cpp"

          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $content = $content -replace 'L"mfuko_wa_kanisa"', 'L"MFUKO WA MAPATO YA KANISA"'
            Set-Content $file $content
          }

      - name: Install application icon
        shell: pwsh
        run: |
          if (Test-Path "branding/windows/app_icon.ico") {
            Copy-Item `
              "branding/windows/app_icon.ico" `
              "windows/runner/resources/app_icon.ico" `
              -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Supabase configuration
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) {
            Write-Error "SUPABASE_URL is missing."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_PUBLISHABLE_KEY)) {
            Write-Error "SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          }

      - name: Build Windows Release
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build windows `
            --release `
            --dart-define=SUPABASE_URL="$env:SUPABASE_URL" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$env:SUPABASE_PUBLISHABLE_KEY" `
            --dart-define=GITHUB_REPO="${{ github.repository }}"

      # ========================================================
      # DOWNLOAD INNO SETUP
      # ========================================================

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      # ========================================================
      # CREATE PROFESSIONAL INSTALLER SCRIPT
      # ========================================================

      - name: Create Installer
        shell: pwsh
        run: |

          New-Item -ItemType Directory -Force -Path installer | Out-Null

          @'
          #define MyAppName "MFUKO WA MAPATO YA KANISA"
          #define MyAppVersion "0.9.2"
          #define MyAppPublisher "MFUKO WA MAPATO YA KANISA"
          #define MyAppExeName "mfuko_wa_kanisa.exe"

          [Setup]

          AppId={{9F7A6D21-8A8B-4D53-9A91-7C1B7B7A9021}

          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}

          AppPublisher={#MyAppPublisher}

          DefaultDirName={autopf}\MfukoWaKanisa

          DefaultGroupName={#MyAppName}

          OutputDir=installer-output

          OutputBaseFilename=MFUKO-WA-KANISA-Setup-v{#MyAppVersion}

          Compression=lzma2/max

          SolidCompression=yes

          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          DisableProgramGroupPage=yes

          PrivilegesRequired=admin

          WizardStyle=modern

          UninstallDisplayName={#MyAppName}

          Uninstallable=yes

          SetupIconFile=..\branding\windows\app_icon.ico

          VersionInfoVersion={#MyAppVersion}.0
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoDescription={#MyAppName} Windows Installer
          VersionInfoProductName={#MyAppName}
          VersionInfoProductVersion={#MyAppVersion}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; \
          Description: "Create a desktop shortcut"; \
          GroupDescription: "Additional shortcuts:"; \
          Flags: unchecked

          [Files]

          Source: "..\build\windows\x64\runner\Release\*"; \
          DestDir: "{app}"; \
          Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]

          Name: "{autoprograms}\{#MyAppName}"; \
          Filename: "{app}\{#MyAppExeName}"; \
          WorkingDir: "{app}"

          Name: "{autodesktop}\{#MyAppName}"; \
          Filename: "{app}\{#MyAppExeName}"; \
          WorkingDir: "{app}"; \
          Tasks: desktopicon

          [Run]

          Filename: "{app}\{#MyAppExeName}"; \
          Description: "Launch {#MyAppName}"; \
          Flags: nowait postinstall skipifsilent

          [UninstallDelete]

          Type: filesandordirs; \
          Name: "{app}"

          [Code]

          function InitializeSetup(): Boolean;
          begin
            Result := True;
          end;

          function InitializeWizard(): Boolean;
          begin
            Result := True;
          end;

          '@ | Set-Content installer\setup.iss -Encoding UTF8

      # ========================================================
      # BUILD SINGLE EXE INSTALLER
      # ========================================================

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer\setup.iss"

      # ========================================================
      # VERIFY INSTALLER
      # ========================================================

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "installer-output\*.exe" `
            -ErrorAction Stop

          Write-Host "====================================="
          Write-Host "INSTALLER CREATED SUCCESSFULLY"
          Write-Host "====================================="
          Write-Host "File: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      # ========================================================
      # UPLOAD INSTALLER TO GITHUB ACTIONS
      # ========================================================

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MFUKO-WA-KANISA-Windows-Installer
          path: installer-output/*.exe
          retention-days: 30

      # ========================================================
      # CREATE GITHUB RELEASE WHEN PUSHING TAG
      # ========================================================

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/*.exe
          generate_release_notes: true


  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name mfuko_wa_kanisa \
            --org tz.mfuko \
            .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk \
            --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GITHUB_REPO="${{ github.repository }}"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/mfuko-wa-kanisa.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFUKO-WA-KANISA-Android
          path: build/mfuko-wa-kanisa.apk
